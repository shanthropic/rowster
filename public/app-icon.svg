<svg
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Dark background with 20% corner radius -->
  <rect
    width="24"
    height="24"
    rx="4.8"
    fill="#262626"
  />

  <!-- Main circle -->
  <circle
    cx="12"
    cy="12"
    r="8.5"
    stroke="#FFFFFF"
    stroke-width="2"
  />

  <!-- Geometrically balanced R -->
  <path
    d="
      M8.5 16.5
      V7.5
      H12.25
      C14.35 7.5 15.75 8.65 15.75 10.5
      C15.75 12.35 14.35 13.5 12.25 13.5
      H8.5
      M12.25 13.5
      L16.25 16.5
    "
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Accent cutout using background color -->
  <circle
    cx="18.01"
    cy="5.99"
    r="1.15"
    fill="#262626"
  />
</svg>
